name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
        if: runner.os != 'Windows'
      # temporary: record what blocks file deletion on Windows
      - run: python -m pip install psutil
        if: runner.os == 'Windows'
      - run: python -m pytest -q
        if: runner.os == 'Windows'
        env:
          HDFE_STREAM_DEBUG_CLEANUP: ${{ runner.temp }}\cleanup-debug.txt
      - run: Get-Content "$env:RUNNER_TEMP\cleanup-debug.txt" -ErrorAction SilentlyContinue | Select-Object -First 300
        if: always() && runner.os == 'Windows'

  minimum-versions:
    name: lowest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.10
      - run: uv pip install --resolution lowest-direct ".[test]"
      - run: .venv/bin/python -m pytest -q

  package:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
