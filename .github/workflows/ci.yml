name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # pyfixest 0.60 has no 3.15 wheels, and the PyO3 it builds with predates
      # 3.15: this lets the source build go ahead on the stable ABI. Drop it
      # once pyfixest publishes 3.15 wheels.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: ${{ matrix.python == '3.15' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  minimum-versions:
    name: lowest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.10
      - run: uv pip install --resolution lowest-direct ".[test]"
      - run: .venv/bin/python -m pytest -q

  polars-64:
    name: polars 64-bit runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # polars uses UInt64 row indices when this runtime is installed (#5)
      - run: python -m pip install ".[test]" polars-runtime-64
      - run: python -m pytest -q

  package:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
