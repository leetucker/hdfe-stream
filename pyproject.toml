[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hdfe-stream"
version = "0.2.2"
description = "Out-of-core regression with several high-dimensional fixed effects: OLS, Poisson, logit and probit, with AKM/KSS variance decompositions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Lee Tucker" }]
keywords = ["econometrics", "fixed effects", "high-dimensional", "out-of-core", "AKM", "KSS", "pyfixest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "polars>=1.37,!=1.41.*",       # 1.41 panics in streaming joins of wide frames
    "numpy>=1.24",
    "numba>=0.59",
    "pyarrow>=14.0",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/leetucker/hdfe-stream"
Source = "https://github.com/leetucker/hdfe-stream"
Issues = "https://github.com/leetucker/hdfe-stream/issues"
Documentation = "https://github.com/leetucker/hdfe-stream/tree/main/docs"
Changelog = "https://github.com/leetucker/hdfe-stream/blob/main/CHANGELOG.md"

[project.optional-dependencies]
within = ["within-py>=0.3.0"]
amg = ["pyamg>=5.1"]
formula = [
    "pyfixest>=0.60.0,<0.61.0",
    "formulaic>=1.0",
    "pandas>=2.0",
]
all = ["hdfe-stream[within,amg,formula]"]
# benchmarks/: pyfixest to compare against and matplotlib for the figures.
# xhdfe is compared too, but installs from source (see benchmarks/README.md)
benchmark = [
    "hdfe-stream[formula]",
    "matplotlib>=3.7",
]
# the test suite compares against pyfixest and exercises the optional solvers,
# so it needs every extra
test = [
    "pytest>=7.0",
    "hdfe-stream[all]",
]

[tool.setuptools.package-data]
hdfe_stream = ["py.typed"]

[tool.setuptools.packages.find]
include = ["hdfe_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # pyfixest and its dependencies are noisy about deprecations we don't control
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
