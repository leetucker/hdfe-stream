[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdfe-stream"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.9",
    "numpy>=1.24",
    "numba>=0.59",
    "pyarrow>=14.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
within = ["within-py>=0.3.0"]
amg = ["pyamg>=5.0"]
formula = [
    "pyfixest>=0.50.0,<0.61.0",
    "formulaic>=1.0",
    "pandas>=2.0",
]
all = ["hdfe-stream[within,amg,formula]"]
