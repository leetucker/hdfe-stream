[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hdfe-stream"
version = "0.8.0"
description = "Out-of-core regression with several high-dimensional fixed effects: OLS, Poisson, logit and probit, with AKM/KSS variance decompositions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Lee Tucker" }]
keywords = ["econometrics", "fixed effects", "high-dimensional", "out-of-core", "AKM", "KSS", "pyfixest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "polars>=1.37,!=1.41.*",       # 1.41 panics in streaming joins of wide frames
    "numpy>=1.24",
    "numba>=0.59",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "threadpoolctl>=3.1",       # BLAS held to one thread in numba-heavy passes
    "stream-limits>=0.1",       # thread and memory limits for jobs on a scheduler
]

[project.urls]
Homepage = "https://github.com/leetucker/hdfe-stream"
Source = "https://github.com/leetucker/hdfe-stream"
Issues = "https://github.com/leetucker/hdfe-stream/issues"
Documentation = "https://leetucker.github.io/hdfe-stream/"
Changelog = "https://github.com/leetucker/hdfe-stream/blob/main/CHANGELOG.md"

[project.optional-dependencies]
within = ["within-py>=0.3.0"]
amg = ["pyamg>=5.1"]
formula = [
    "pyfixest>=0.60.0,<0.61.0",
    "formulaic>=1.0",
    "pandas>=2.0",
]
all = ["hdfe-stream[within,amg,formula]"]
# benchmarks/: pyfixest to compare against and matplotlib for the figures.
# xhdfe is compared too, but installs from source (see benchmarks/README.md)
benchmark = [
    "hdfe-stream[formula]",
    "matplotlib>=3.7",
    # the OLS, IV, logit and probit benchmarks' competitors
    "scikit-learn",
    "polars-ols",
    "polars-ds",
    "statsmodels",
    "linearmodels",
    "glum",
]
# docs/: the documentation site, built with Sphinx (see docs/conf.py)
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]
# the test suite compares against pyfixest and exercises the optional solvers,
# so it needs every extra; wildboottest is what pyfixest's wild cluster
# bootstrap runs on, which tests/test_wildboot.py compares against
test = [
    "pytest>=7.0",
    "hdfe-stream[all]",
    "wildboottest>=0.3.2",
]

[tool.setuptools.package-data]
hdfe_stream = ["py.typed"]

[tool.setuptools.packages.find]
include = ["hdfe_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # pyfixest and its dependencies are noisy about deprecations we don't control
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
