[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdfe-stream"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.9",
    "numpy>=1.24",
    "numba>=0.59",
    "pyarrow>=14.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
within = ["within-py>=0.3.0"]
amg = ["pyamg>=5.0"]
formula = [
    "pyfixest>=0.50.0,<0.61.0",
    "formulaic>=1.0",
    "pandas>=2.0",
]
all = ["hdfe-stream[within,amg,formula]"]
# benchmarks/: pyfixest to compare against and matplotlib for the figures.
# xhdfe is compared too, but installs from source (see benchmarks/README.md)
benchmark = [
    "hdfe-stream[formula]",
    "matplotlib>=3.7",
]
# the test suite compares against pyfixest, so it needs the formula extra
test = [
    "pytest>=7.0",
    "hdfe-stream[formula]",
]

[tool.setuptools.packages.find]
include = ["hdfe_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # pyfixest and its dependencies are noisy about deprecations we don't control
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
